<!DOCTYPE html>
<html lang="en">
<head>
    <title>Transaction Detail</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="css/theme.css?v=fixaug5c">
    <link rel="stylesheet" href="css/style.css?v=fixaug5c">
    <style>
        /* White "vault/ledger" theme, matching explorer.html's own
           white-background treatment (this page is reached FROM the
           explorer's transaction list, so it should feel like the
           same tool) - this file previously had its own separate
           black theme left over from before explorer.html was
           switched to white, which is exactly the "black background
           on the follow-up transaction pages" report this fixes. */
        body.outernet-light{
            background:#ffffff;
            color:#111827;
        }
        body{
            display:block;
        }
        .tx-page{
            max-width:700px;
            margin:0 auto;
            padding:24px 16px 40px;
        }
        body.outernet-light .card{
            background:#ffffff;
            border:1px solid #e5e7eb;
            box-shadow:0 1px 2px rgba(16,24,40,.04);
        }
        .card:hover{
            transform:none;
            box-shadow:none;
        }
        .tx-row{
            display:flex;
            justify-content:space-between;
            gap:16px;
            padding:10px 0;
            border-bottom:1px solid #e5e7eb;
            font-size:13px;
        }
        .tx-row:last-child{
            border-bottom:none;
        }
        .tx-row-label{
            opacity:0.6;
            font-size:11px;
            text-transform:uppercase;
            letter-spacing:0.5px;
            flex:0 0 auto;
            padding-top:2px;
        }
        .tx-row-value{
            font-family:monospace;
            text-align:right;
            word-break:break-all;
        }
        .explorer-pill{
            display:inline-block;
            font-size:10px;
            text-transform:uppercase;
            letter-spacing:0.5px;
            padding:2px 8px;
            border-radius:8px;
            border:1px solid #d1d5db;
        }
        .explorer-pill.confirmed{
            color:#0f9d58;
            border-color:#0f9d58;
        }
        .tx-summary{
            font-size:15px;
            margin:0 0 16px;
        }
        .tx-raw{
            margin-top:16px;
        }
        .tx-raw summary{
            cursor:pointer;
            font-size:12px;
            opacity:0.6;
        }
        .tx-raw pre{
            margin-top:10px;
            padding:12px;
            background:#f9fafb;
            border:1px solid #e5e7eb;
            border-radius:8px;
            font-size:11px;
            overflow-x:auto;
            white-space:pre-wrap;
            word-break:break-all;
        }
        .explorer-empty{
            opacity:0.6;
            padding:10px 0;
        }
    </style>
</head>
<body class="outernet-light">
<script src="js/device-lock.js?v=fixaug5b"></script>
<script src="js/protocol-badge.js?v=creditchainbadge1"></script>

<div class="tx-page">

    <p><a href="explorer" style="color:var(--cc-accent-gold, #c9a227);">&larr; Explorer</a></p>

    <h1 style="margin-bottom:4px;">Transaction</h1>
    <p style="opacity:0.6;font-size:13px;margin-top:0;">Full detail for a single confirmed transaction.</p>

    <div class="card">
        <div id="txDetailContent">
            <p class="explorer-empty" style="opacity:0.6;">Loading...</p>
        </div>
    </div>

</div>

<script src="js/network-config.js?v=netfix0827"></script>
<script src="js/api.js?v=sec0827"></script>
<script src="js/ai-assistant.js?v=fixaug5b"></script>
<script src="js/tx.js?v=sec0816a"></script>

</body>
</html>
