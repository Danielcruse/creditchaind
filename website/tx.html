<!DOCTYPE html>
<html lang="en">
<head>
    <title>Transaction Detail</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="css/theme.css?v=fixaug5c">
<link rel="stylesheet" href="css/design-system.css?v=1">
    <link rel="stylesheet" href="css/style.css?v=fixaug5c">
    <style>
        /* White "vault/ledger" theme, matching explorer.html's own
           white-background treatment (this page is reached FROM the
           explorer's transaction list, so it should feel like the
           same tool) - this file previously had its own separate
           black theme left over from before explorer.html was
           switched to white, which is exactly the "black background
           on the follow-up transaction pages" report this fixes. */
        body.outernet-light{
            background:#ffffff;
            color:#111827;
        }
        body{
            display:block;
        }
        .tx-page{
            max-width:700px;
            margin:0 auto;
            padding:24px 16px 40px;
        }
        body.outernet-light .card{
            background:#ffffff;
            border:1px solid #e5e7eb;
            box-shadow:0 1px 2px rgba(16,24,40,.04);
        }
        .card:hover{
            transform:none;
            box-shadow:none;
        }
        .tx-row{
            display:flex;
            justify-content:space-between;
            gap:16px;
            padding:10px 0;
            border-bottom:1px solid #e5e7eb;
            font-size:13px;
        }
        .tx-row:last-child{
            border-bottom:none;
        }
        .tx-row-label{
            opacity:0.6;
            font-size:11px;
            text-transform:uppercase;
            letter-spacing:0.5px;
            flex:0 0 auto;
            padding-top:2px;
        }
        .tx-row-value{
            font-family:monospace;
            text-align:right;
            word-break:break-all;
        }
        .explorer-pill{
            display:inline-block;
            font-size:10px;
            text-transform:uppercase;
            letter-spacing:0.5px;
            padding:2px 8px;
            border-radius:8px;
            border:1px solid #d1d5db;
        }
        .explorer-pill.confirmed{
            color:#16A34A;
            border-color:#16A34A;
        }
        .tx-summary{
            font-size:16px;
            font-weight:600;
            margin:0 0 14px;
        }

        /* Status header - icon + text + color together, never color
           alone (a colorblind visitor, or anyone on a low-color
           terminal/reader, still gets the word "Confirmed"). */
        .tx-status-header{
            display:flex;
            align-items:center;
            gap:10px;
            margin-bottom:10px;
            flex-wrap:wrap;
        }
        .tx-status-icon{
            font-size:20px;
            font-weight:700;
        }
        .tx-status-text{
            font-size:15px;
            font-weight:700;
        }
        .tx-category-badge{
            margin-left:auto;
            font-size:11px;
            font-weight:600;
            text-transform:uppercase;
            letter-spacing:0.5px;
            color:var(--brand-blue, #2F6BFF);
            border:1px solid var(--brand-blue, #2F6BFF);
            border-radius:8px;
            padding:2px 9px;
        }

        /* Plain sender -> amount -> recipient (or, for a cross-network
           transaction, source-network -> CreditChain -> destination-
           network) picture - deliberately just three boxes and an
           arrow, not a full diagramming library, per the design spec's
           "simple ASCII/visual flow" ask. */
        .tx-flow{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:10px;
            margin:14px 0 18px;
            padding:14px 10px;
            background:#f9fafb;
            border:1px solid #e5e7eb;
            border-radius:10px;
            flex-wrap:wrap;
        }
        .tx-flow-node{
            font-family:monospace;
            font-size:12px;
            font-weight:600;
            padding:8px 12px;
            background:#ffffff;
            border:1px solid #d1d5db;
            border-radius:8px;
            word-break:break-all;
            text-align:center;
        }
        .tx-flow-arrow{
            font-size:18px;
            opacity:0.7;
            text-align:center;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:2px;
        }
        .tx-flow-amount{
            font-size:11px;
            font-weight:700;
            opacity:1;
            color:var(--brand-teal, #16B8A6);
        }
        .tx-flow-usd{
            font-size:10px;
            font-weight:600;
            opacity:0.6;
        }

        .tx-actions{
            display:flex;
            gap:8px;
            margin-bottom:18px;
            flex-wrap:wrap;
        }
        .tx-action-btn{
            font-size:12px;
            font-weight:600;
            padding:7px 14px;
            border-radius:8px;
            border:1px solid #d1d5db;
            background:#ffffff;
            /* This class never set its own color, so style.css's global
               "button{color:white}" rule was the only declaration for
               that property and applied - white text on this white
               background, invisible. Set explicitly here. */
            color:#111827;
            cursor:pointer;
        }
        .tx-action-btn:hover{
            border-color:var(--brand-blue, #2F6BFF);
            color:var(--brand-blue, #2F6BFF);
        }

        .tx-section-title{
            font-size:12px;
            text-transform:uppercase;
            letter-spacing:0.5px;
            opacity:0.6;
            margin:18px 0 4px;
        }

        /* Advanced Blockchain Data - kept visually secondary (smaller,
           collapsed by default, muted) and always below the plain-
           English summary/flow/transfer-details above it, never the
           other way around. */
        .tx-advanced{
            margin-top:20px;
            border-top:1px solid #e5e7eb;
            padding-top:6px;
        }
        .tx-advanced summary{
            cursor:pointer;
            font-size:12px;
            font-weight:600;
            opacity:0.6;
            padding:6px 0;
        }
        .tx-advanced .tx-row{
            font-size:12px;
        }
        .tx-raw{
            margin-top:12px;
        }
        .tx-raw pre{
            margin-top:6px;
            padding:12px;
            background:#f9fafb;
            border:1px solid #e5e7eb;
            border-radius:8px;
            font-size:11px;
            overflow-x:auto;
            white-space:pre-wrap;
            word-break:break-all;
        }
        .explorer-empty{
            opacity:0.6;
            padding:10px 0;
        }
    </style>
</head>
<body class="outernet-light">
<script src="js/device-lock.js?v=fixaug5b"></script>
<script src="js/protocol-badge.js?v=creditchainbadge1"></script>

<div class="tx-page">

    <p><a href="explorer" style="color:var(--cc-accent-gold, #16B8A6);">&larr; Explorer</a></p>

    <h1 style="margin-bottom:4px;">Transaction</h1>
    <p style="opacity:0.6;font-size:13px;margin-top:0;">Full detail for a single confirmed transaction.</p>

    <div class="card">
        <div id="txDetailContent">
            <p class="explorer-empty" style="opacity:0.6;">Loading...</p>
        </div>
    </div>

</div>

<script src="js/network-config.js?v=netfix0827"></script>
<script src="js/api.js?v=sec0827"></script>
<script src="js/ai-assistant.js?v=fixaug5b"></script>
<script src="js/tx.js?v=sec0816a"></script>

</body>
</html>
