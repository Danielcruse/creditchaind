<!DOCTYPE html>
<html>
<head>
    <title>OUTERNET Validator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>Validator Dashboard</h1>

<div class="card">

    <h2>Validator Status</h2>

    <p>
        Status:
        <span id="validatorStatus">
            Inactive
        </span>
    </p>

    <p>
        Reputation:
        <span id="validatorReputation">
            0
        </span>
    </p>

    <p>
        Voting Power:
        <span id="validatorVotingPower">
            0
        </span>
    </p>

    <p>
        Blocks Produced:
        <span id="blocksProduced">
            0
        </span>
    </p>

    <p>
        Rewards:
        <span id="validatorRewards">
            0
        </span>
    </p>

</div>

<br>

<div class="card">

    <h2>Become Validator</h2>

    <p>
        Requirements:
    </p>

    <ul>
        <li>Reputation ≥ 50</li>
        <li>Stake ETH or CCT</li>
    </ul>

    <button onclick="becomeValidator()">
        Become Validator
    </button>

</div>

<br>

<div class="card">

    <h2>Produce Test Block</h2>

    <button onclick="produceBlock()">
        Produce Block
    </button>

</div>

<br>

<button
    onclick="location.href='wallet.html'">
    Back To Wallet
</button>

<script src="js/validator.js"></script>

</body>
</html>
