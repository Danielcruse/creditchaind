<!DOCTYPE html>
<html>
<head>
    <title>Create Account</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>Create OUTERNET Account</h1>

<div class="card">

    <input
        type="text"
        id="username"
        placeholder="Username">

    <br><br>

    <input
        type="email"
        id="email"
        placeholder="Email">

    <br><br>

    <input
        type="password"
        id="password"
        placeholder="Password">

    <br><br>

    <input
        type="text"
        id="region"
        placeholder="Region">

    <br><br>

    <button onclick="register()">
        Create Account
    </button>

</div>

<script>

function register() {

    let username =
        document.getElementById(
            "username"
        ).value;

    let email =
        document.getElementById(
            "email"
        ).value;

    let password =
        document.getElementById(
            "password"
        ).value;

    let region =
        document.getElementById(
            "region"
        ).value;

    if (
        username === "" ||
        email === "" ||
        password === ""
    ) {
        alert(
            "Please complete all fields."
        );
        return;
    }

    localStorage.setItem(
        "username",
        username
    );

    localStorage.setItem(
        "email",
        email
    );

    localStorage.setItem(
        "password",
        password
    );

    localStorage.setItem(
        "region",
        region
    );

    localStorage.setItem(
        "wallet",
        "0xTEST" +
        Math.floor(
            Math.random()*1000000
        )
    );

    localStorage.setItem(
        "reputation",
        "50"
    );

    localStorage.setItem(
        "voting",
        "100"
    );

    alert(
        "Account created successfully!"
    );

    location.href =
        "login.html";
}

</script>

</body>
</html>
