<!DOCTYPE html>
<html>
<head>
    <title>OUTERNET Governance</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>Governance</h1>

<div class="card">

    <h2>Create Proposal</h2>

    <input
        id="proposalTitle"
        placeholder="Proposal Title">

    <br><br>

    <textarea
        id="proposalDescription"
        placeholder="Proposal Description">
    </textarea>

    <br><br>

    <button onclick="createProposal()">
        Submit Proposal
    </button>

</div>

<br>

<div class="card">

    <h2>Active Proposals</h2>

    <div id="proposalList">
        No proposals yet.
    </div>

</div>

<br>

<button
    onclick="location.href='wallet.html'">
    Back To Wallet
</button>

<script src="js/governance.js"></script>

</body>
</html>
