<!DOCTYPE html>
<html>
<head>
    <title>OUTERNET Wallet</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>OUTERNET Wallet</h1>

<div class="card">

    <h2>Profile</h2>

    <p>
        Wallet:
        <span id="walletAddress">
            Loading...
        </span>
    </p>

    <p>
        Reputation:
        <span id="reputation">
            0
        </span>
    </p>

    <p>
        Voting Power:
        <span id="votingPower">
            0
        </span>
    </p>

    <p>
        Credit Score:
        <span id="creditScore">
            0
        </span>
    </p>

</div>

<br>

<div class="card">

    <h2>Balances</h2>

    <p>
        ETH:
        <span id="ethBalance">
            0
        </span>
    </p>

    <p>
        oETH:
        <span id="oethBalance">
            0
        </span>
    </p>

    <p>
        CCT:
        <span id="cctBalance">
            0
        </span>
    </p>

    <p>
        Rewards:
        <span id="rewardBalance">
            0
        </span>
    </p>

</div>

<br>

<div class="card">

    <h2>Actions</h2>

    <button
        onclick="
            location.href='staking.html'
        ">
        Stake
    </button>

    <button>
        Send
    </button>

    <button>
        Receive
    </button>

    <button>
        Claim Rewards
    </button>

</div>

<br>

<div class="card">

    <h2>Recent Transactions</h2>

    <div id="transactions">
        No Transactions
    </div>

</div>

<script src="js/wallet.js"></script>

</body>
</html>
