<!DOCTYPE html>
<html>
<head>
    <title>OUTERNET Login</title>
</head>
<body>

<h1>OUTERNET Login</h1>

<input
type="email"
id="email"
placeholder="Email">

<br><br>

<input
type="password"
id="password"
placeholder="Password">

<br><br>

<button onclick="login()">
Login
</button>

<br><br>

<button onclick="location.href='register.html'">
Create Account
</button>

<script>

function login() {

    const email =
        document.getElementById(
            "email"
        ).value;

    const password =
        document.getElementById(
            "password"
        ).value;

    if (
        email === localStorage.getItem("email")
        &&
        password === localStorage.getItem("password")
    ) {

        localStorage.setItem(
            "loggedIn",
            "true"
        );

        window.location.href =
            "outernet.html";
    }
    else {

        alert(
            "Incorrect email or password"
        );
    }
}

</script>

</body>
</html>
