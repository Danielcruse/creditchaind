<!DOCTYPE html>
<html>
<head>
    <title>Price Chart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="css/theme.css?v=fixaug5c">
    <link rel="stylesheet" href="css/pool-light.css?v=fixaug5c">
</head>
<body class="pool-light">
<script src="js/device-lock.js?v=fixaug5b"></script>
<script src="js/protocol-badge.js?v=creditchainbadge1"></script>

<div class="pool-topbar">
    <a class="pool-topbar-brand" href="pool">Pool</a>
    <div class="pool-topbar-links">
        <a href="liquidity">Liquidity Pool</a>
        <a href="swap">Swap</a>
        <a href="order-book">Order Book</a>
        <a href="outernet">Back to OUTERNET</a>
    </div>
</div>

<div class="pool-wrap">
    <a class="pool-back-link" href="pool">&larr; Pool</a>

    <div class="pool-card">
        <h2>Price Chart</h2>
        <p class="pool-muted">
            Live price for every token that trades on OUTERNET, in CCT per unit - sampled every time a
            swap or liquidity change actually moves a pool's ratio, not on a fixed interval, so a quiet
            token shows a flat line.
        </p>

        <div class="pool-row">
            <select id="pcTokenSymbol"></select>
        </div>

        <div id="pcChartContainer"><p class="pool-empty">Loading...</p></div>
    </div>
</div>

<script src="js/network-config.js?v=netfix0823"></script>
<script src="js/api.js?v=sec0815a"></script>
<script src="js/ai-assistant.js?v=fixaug5b"></script>
<script src="js/price-chart.js?v=fixaug5b"></script>

</body>
</html>
